name: Bug report
description: Something in GmailDock is not working
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS (Apple Silicon), macOS (Intel), Linux (x86_64), Linux (arm64)]
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version and desktop environment
      placeholder: "Ubuntu 24.04 GNOME / Windows 11 23H2 / macOS 15"
  - type: input
    id: version
    attributes:
      label: GmailDock version (Settings, About)
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package type
      placeholder: ".exe, .msi, .dmg, .deb, .rpm, .AppImage"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Sign-in, Unread badge, Notifications, Tray / close behavior, Updater, Settings, Other]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or screenshots
