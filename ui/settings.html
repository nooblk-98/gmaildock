<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src ipc: http://ipc.localhost">
<title>GmailDock preferences</title><link rel="stylesheet" href="settings.css">
<main><h1>Preferences</h1><form id="settings">
<div id="toggles"></div>
<label for="shortcut">Show or hide shortcut</label><input id="shortcut" placeholder="CommandOrControl+Shift+G"><small>Leave empty to disable. Use modifiers joined with +.</small>
<label for="zoom">Zoom</label><select id="zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="0.9">90%</option><option value="1">100%</option><option value="1.1">110%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
<p><button type="submit">Save</button> <button id="reset" type="button">Reset preferences</button></p>
</form><p id="status" role="status"></p><h2>Diagnostics</h2><textarea id="diagnostics" readonly aria-label="Diagnostics"></textarea>
<p>Notifications disabled by the operating system cannot be detected reliably. Check your system notification settings if alerts do not appear.</p>
<script src="settings.js"></script></main></html>
